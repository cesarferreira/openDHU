<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openDHU</title>
<style>
  :root {
    --bg: #101214; --panel: #181b1f; --line: #2a2f35; --text: #e6e8ea; --dim: #8b939c;
    --accent: #56d6b8; --pass: #4cc38a; --fail: #f2555a; --skip: #e5b343; --run: #5bb8f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header, footer {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
  }
  footer { border-top: 1px solid var(--line); border-bottom: 0; color: var(--dim); font-size: 12px; }
  header b { color: var(--accent); }
  #summary, #note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #summary { color: var(--dim); flex: 1; }
  #note { flex: 1; }
  #note.bad { color: var(--fail); }
  #screen.unfocused { opacity: 0.35; filter: grayscale(1); }
  main { display: grid; grid-template-columns: 1fr; min-height: 0; }
  main.with-log { grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); }
  #stage { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 12px 16px; gap: 12px; }
  #screen-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #screen {
    display: block; max-width: 100%; max-height: 100%; background: #000;
    border-radius: 8px; box-shadow: 0 0 0 1px var(--line); cursor: crosshair;
    user-select: none; -webkit-user-drag: none; touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text); text-align: center; padding: 16px; pointer-events: none;
    text-shadow: 0 1px 3px #000, 0 0 12px #000;
  }
  #keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  button kbd { color: var(--dim); font-size: 11px; margin-left: 4px; }
  button.on kbd { color: #000; }
  #log-pane { display: none; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
  main.with-log #log-pane { display: flex; }
  #log-head { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--dim); display: flex; gap: 8px; }
  #log-head span:first-child { flex: 1; }
  #log {
    flex: 1; overflow: auto; margin: 0; padding: 8px 12px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .pass { color: var(--pass); } .fail { color: var(--fail); } .skip { color: var(--skip); }
  .run { color: var(--run); } .heading { color: var(--run); font-weight: 600; }
  #result.pass, #result.fail { font-weight: 600; }
  @media (max-width: 760px) {
    body { overflow: auto; }
    main.with-log { grid-template-columns: 1fr; grid-template-rows: auto 50vh; }
    #log-pane { border-left: 0; border-top: 1px solid var(--line); }
    #screen-wrap { min-height: 200px; }
  }
</style>
</head>
<body>
<header>
  <b>openDHU</b>
  <span id="summary">connecting…</span>
</header>
<main id="main">
  <section id="stage">
    <div id="screen-wrap">
      <img id="screen" alt="Head unit screen" draggable="false">
      <div id="overlay">connecting…</div>
    </div>
    <div id="keys">
      <button data-key="back">Back<kbd>Esc</kbd></button>
      <button data-key="home">Home<kbd>H</kbd></button>
      <button data-key="left">◀</button>
      <button data-key="up">▲</button>
      <button data-key="down">▼</button>
      <button data-key="right">▶</button>
      <button data-key="enter">Enter<kbd>↵</kbd></button>
      <button data-key="search">Search<kbd>S</kbd></button>
      <button data-key="previous">Prev<kbd>P</kbd></button>
      <button data-key="play_pause">Play/pause<kbd>Space</kbd></button>
      <button data-key="next">Next<kbd>N</kbd></button>
      <button data-key="call">Call<kbd>C</kbd></button>
      <button data-key="end_call">End<kbd>E</kbd></button>
      <button id="focus">Video focus<kbd>F</kbd></button>
      <button id="shot">Screenshot<kbd>⇧S</kbd></button>
    </div>
  </section>
  <aside id="log-pane">
    <div id="log-head"><span>Test log</span><span id="result"></span></div>
    <pre id="log"></pre>
  </aside>
</main>
<footer>
  <span id="note">Click to tap · drag to swipe · wheel to scroll</span>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const screen = $("screen"), overlay = $("overlay"), logEl = $("log");
// A press that moves less than this many phone pixels before release is a tap.
const TAP_SLOP = 24;
let lostSession = false, session = null, last = null, runEnded = false, serverGone = false, noteTimer = 0;

function note(text) {
  $("note").classList.remove("bad");
  $("note").textContent = text;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $("note").textContent = "Click to tap · drag to swipe · wheel to scroll"; }, 3000);
}

async function post(path, body, label) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    // `accepted` only means it was sent: the phone does not confirm touch or buttons.
    const how = j.status === "accepted" ? "sent" : j.status === "observed" ? "phone confirmed" : j.status;
    note(r.ok ? `${label}: ${how}` : `${label} failed: ${j.error || r.status}`);
    if (!r.ok) $("note").classList.add("bad");
  } catch (e) {
    note(`${label}: ${e.message}`);
  }
}

const key = (name) => post("/api/key", { key: name }, name);

// --- picture ---------------------------------------------------------------
function connectVideo() { screen.src = `/video.mjpg?t=${Date.now()}`; }
screen.addEventListener("error", () => setTimeout(connectVideo, 1000));
// The first frame of a stream: hide "waiting for video" now rather than at the next status poll.
screen.addEventListener("load", showOverlay);
connectVideo();

function phonePoint(ev) {
  if (!session) return null;
  const r = screen.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
  if (x < 0 || y < 0 || x > 1 || y > 1) return null;
  return [Math.min(session.width - 1, Math.round(x * session.width)),
          Math.min(session.height - 1, Math.round(y * session.height))];
}

let press = null;
screen.addEventListener("pointerdown", (ev) => {
  const at = phonePoint(ev);
  if (!at) return;
  screen.setPointerCapture(ev.pointerId);
  press = { at, since: performance.now() };
  ev.preventDefault();
});
screen.addEventListener("pointerup", (ev) => {
  if (!press) return;
  const from = press.at, held = performance.now() - press.since;
  press = null;
  const r = screen.getBoundingClientRect();
  // Clamp to the picture, so a drag that ends outside it still swipes to the edge.
  const to = phonePoint({
    clientX: Math.min(Math.max(ev.clientX, r.left), r.right - 1),
    clientY: Math.min(Math.max(ev.clientY, r.top), r.bottom - 1),
  });
  if (!to) return;
  if (Math.max(Math.abs(from[0] - to[0]), Math.abs(from[1] - to[1])) < TAP_SLOP) {
    post("/api/tap", { x: from[0], y: from[1] }, "tap");
  } else {
    post("/api/swipe", { from, to, durationMs: Math.round(Math.min(Math.max(held, 100), 1500)) }, "swipe");
  }
});
screen.addEventListener("pointercancel", () => { press = null; });

let wheelBusy = false;
screen.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const at = phonePoint(ev);
  if (!at || wheelBusy) return;
  wheelBusy = true;
  setTimeout(() => { wheelBusy = false; }, 300);
  const reach = Math.floor(session.height / 3), h = session.height - 1;
  const lo = Math.max(0, at[1] - reach / 2), hi = Math.min(h, at[1] + reach / 2);
  // Wheel up shows what is above: drag the content down.
  const [fromY, toY] = ev.deltaY < 0 ? [lo, hi] : [hi, lo];
  post("/api/swipe", { from: [at[0], Math.round(fromY)], to: [at[0], Math.round(toY)], durationMs: 250 }, "scroll");
}, { passive: false });

// --- buttons and keys ------------------------------------------------------
document.querySelectorAll("[data-key]").forEach((b) => b.addEventListener("click", () => key(b.dataset.key)));
$("focus").addEventListener("click", () => {
  const on = !(session && session.videoFocus === "on");
  note(on ? "taking video focus…" : "releasing video focus…");
  post("/api/focus", { on }, on ? "take video focus" : "release video focus").then(refresh);
});
$("shot").addEventListener("click", screenshot);

function screenshot() {
  const a = document.createElement("a");
  a.href = "/api/screenshot";
  a.download = "";
  document.body.appendChild(a);
  a.click();
  a.remove();
  note("screenshot");
}

const KEYS = {
  Escape: "back", b: "back", h: "home", ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left",
  ArrowRight: "right", Enter: "enter", s: "search", " ": "play_pause", n: "next", p: "previous",
  c: "call", e: "end_call",
};
document.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.target.closest("input, textarea")) return;
  if (ev.key === "S") { screenshot(); }
  else if (ev.key === "f") { $("focus").click(); }
  else if (KEYS[ev.key]) { key(KEYS[ev.key]); }
  else return;
  ev.preventDefault();
});

// --- status ----------------------------------------------------------------
async function refresh() {
  let s;
  try {
    s = await (await fetch("/api/status")).json();
    serverGone = false;
  } catch {
    if (!serverGone) {
      serverGone = true;
      $("summary").textContent = runEnded ? "test run finished; the viewer has stopped" : "the web viewer has stopped";
      overlay.textContent = runEnded ? "test run finished" : "not connected to opendhu-web";
      overlay.style.display = "flex";
    }
    return;
  }
  const was = session;
  session = s.session;
  last = s;
  if (s.run) $("main").classList.add("with-log");
  if (session) {
    $("summary").textContent = session.summary;
    screen.style.aspectRatio = `${session.width} / ${session.height}`;
    $("focus").classList.toggle("on", session.videoFocus === "on");
    // A session after none (the run moved on to the next test): ask for its picture afresh.
    if (!was && lostSession) connectVideo();
    lostSession = false;
  } else {
    lostSession = true;
    $("summary").textContent = s.run
      ? (s.run.ended ? "test run finished; no session" : "waiting for the test run to start a session")
      : "no session; start one with `aa session start`";
  }
  showOverlay();
}

function showOverlay() {
  if (!last || serverGone) return;
  // Without focus the phone stops sending frames: what is shown is the last one, not the screen.
  screen.classList.toggle("unfocused", !!session && session.videoFocus === "off");
  const message = !session ? $("summary").textContent
    : session.videoFocus === "off" ? "video focus is off: the phone is not projecting (press F to take it)"
    : last.videoProblem ? last.videoProblem
    : screen.naturalWidth > 0 ? "" : "waiting for video";
  overlay.textContent = message;
  overlay.style.display = message ? "flex" : "none";
}
setInterval(refresh, 1000);
refresh();

// --- test log --------------------------------------------------------------
function follow() {
  const events = new EventSource("/api/log");
  events.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "end") {
      runEnded = true;
      events.close();
      const r = $("result");
      if (!r.textContent) r.textContent = "finished";
      return;
    }
    const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
    const line = document.createElement("div");
    line.textContent = e.text || " ";
    if (e.kind !== "plain") line.className = e.kind;
    logEl.appendChild(line);
    const t = e.text.trim();
    if (t.startsWith("Result: ")) {
      const r = $("result");
      r.textContent = t.slice(8);
      r.className = e.kind;
    }
    // Follow the run unless the reader has scrolled up.
    if (stick) logEl.scrollTop = logEl.scrollHeight;
  };
  // Without a test run there is nothing to follow; the server ends the stream at once.
  events.onerror = () => { if (runEnded || !$("main").classList.contains("with-log")) events.close(); };
}
follow();
</script>
</body>
</html>
