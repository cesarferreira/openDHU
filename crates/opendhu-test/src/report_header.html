:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif;background:#f5f7fa;color:#202a3a}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:40px 24px}h1{font-size:40px;line-height:1.2;margin:8px 0}.eyebrow{font-weight:700;letter-spacing:.06em;color:#52647d}header p,small,.source,footer{color:#58667b}.counts{display:flex;flex-wrap:wrap;gap:12px 24px;padding:20px 0;margin:16px 0;border-block:1px solid #dce2eb}.passed{color:#16703b}.failed,.error{color:#b42332}.skipped{color:#8a6112}details{background:#fff;border:1px solid #dce2eb;border-radius:10px;margin:14px 0;overflow:hidden}summary{padding:18px;cursor:pointer;font-weight:650}summary small{float:right;font-weight:400}.badge{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin:0 10px}.body{padding:0 18px 18px}.source,.detail{overflow-wrap:anywhere}.table{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e6eaf0;vertical-align:top}th{color:#58667b}td:first-child{min-width:130px}td:nth-child(3){white-space:nowrap}.detail{white-space:pre-wrap;min-width:240px}a{color:#245fbd}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;padding:18px}figure{margin:0;min-width:0}img{width:100%;height:auto;border:1px solid #dce2eb;border-radius:6px}figcaption{font-size:12px;overflow-wrap:anywhere}footer{margin-top:32px;font-size:13px}@media(prefers-color-scheme:dark){:root{background:#151a23;color:#e8edf5}details{background:#1e2633;border-color:#364155}.counts,th,td{border-color:#364155}header p,small,.source,footer,th{color:#a6b4c9}.passed{color:#78d9a0}.failed,.error{color:#ff9199}.skipped{color:#edc375}a{color:#91baff}}@media(max-width:600px){main{padding:24px 12px}h1{font-size:32px}summary small{float:none;display:block;margin-top:8px}}
