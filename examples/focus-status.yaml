# Status assertions that work with either backend. `backendReported` is the head unit's own readback.
# With the DHU, `observed` (phone-confirmed) is always unknown, so asserting it would fail by design;
# see native-phone-confirms.yaml for the native backend, where it is real.
name: Focus changes are tracked

requirements:
  - videoFocus

steps:
  - action: focus.video
    value: off

  - action: assert.status
    expect:
      state: running
      videoFocus:
        requested: off
        backendReported: off

  - action: focus.video
    value: on

  - action: waitFor
    condition:
      videoFocus:
        backendReported: on
    timeout: 5s
