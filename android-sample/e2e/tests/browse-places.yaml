name: Browse places and return from destination details
backend: native
requirements: [touchInput, screenshots]
steps:
  - action: app.open
    as: launch the app on the car screen
  - action: ui.tap
    as: open the places list
    text: Browse places
    timeout: 30s
  - action: ui.expect
    as: places list is showing
    text: Riverside Park
    timeout: 30s
  - action: ui.tap
    as: open Harbour Cafe
    text: Harbour Cafe
    timeout: 20s
  - action: ui.expect
    as: cafe details are shown
    text: Coffee by the water
    timeout: 20s
  - action: ui.expect
    as: save button is offered
    text: Save favorite
    timeout: 10s
  - action: ui.tap
    as: go back to the places list
    text: Back to places
    timeout: 20s
  - action: ui.expect
    as: places list is showing again
    text: Riverside Park
    timeout: 20s
  - action: ui.tap
    as: open Riverside Park
    text: Riverside Park
    timeout: 20s
  - action: ui.expect
    as: park details are shown
    text: Walk beside the river
    timeout: 20s
  - action: screenshot
    as: capture the park details
    path: screenshots/place-details.png
