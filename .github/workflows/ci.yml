name: CI

on:
  push:
    branches: [main]
    # Nothing here builds from docs, so they should not spend minutes.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The vendored android-auto crate compiles its .proto files in build.rs.
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      # Cargo silently ignores an unused [patch], so check the patched rustls-webpki is the one used.
      - run: make vendor-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes bill at 10x Linux's rate, so it is off until it is worth the cost.
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The vendored android-auto crate compiles its .proto files in build.rs.
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      # Tests use fake head units and stub adb/ffmpeg/tesseract, so no device or hardware is needed.
      - run: cargo test --workspace --locked
      - run: make validate-examples
