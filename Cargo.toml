[workspace]
resolver = "2"
members = [
    "crates/opendhu-core",
    "crates/opendhu-daemon",
    "crates/opendhu-dhu",
    "crates/opendhu-test",
    "crates/opendhu-cli",
    "crates/opendhu-gui",
    "crates/opendhu-tui",
    "crates/opendhu-native",
    "crates/opendhu-native-hu",
]
# Vendored third-party code is built as a dependency only, never linted or formatted as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/openDHU"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ctrlc = { version = "3", features = ["termination"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = { version = "3", default-features = false }
thiserror = "2"
android-auto = { path = "vendor/android-auto" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Stock rustls-webpki rejects the X.509 v1 root that Android Auto phones present. See
# vendor/rustls-webpki/OPENDHU-PATCHES.md, and check this is used with `cargo tree -i rustls-webpki`.
[patch.crates-io]
rustls-webpki = { path = "vendor/rustls-webpki" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
